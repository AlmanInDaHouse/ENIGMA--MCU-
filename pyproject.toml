[project]
name = "enigma-mcu"
version = "0.1.0"
description = "ENIGMA-MCU — unified atomic contextual-memory engine. Atom model + idempotent vault writer."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "neo4j>=5.0",
    "requests>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["enigma_mcu", "enigma_mcu.adapters", "enigma_mcu.graph", "enigma_mcu.embeddings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires live infrastructure (Neo4j and/or Ollama bge-m3); skipped when unavailable",
]

[project]
name = "enigma-mcu"
version = "0.1.0"
description = "ENIGMA-MCU — unified atomic contextual-memory engine. Atom model + idempotent vault writer."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["enigma_mcu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
